# Host-managed IMEX (IMEXMode "host": every target node labelled nvcre.nvidia.com/imex-mode=host):
# the IMEX channel comes from the host's own IMEX service through a CDI spec (nvidia runtime class), so no ComputeDomain
# is created and the host service is never masked. Otherwise the DRA ComputeDomain path below.
{{- if eq .IMEXMode "host" }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                metadata:
                  annotations:
                    cdi.k8s.io/imex: nvidia.com/imex-channel=all
                spec:
                  # The CDI annotation is honoured by the nvidia runtime handler only.
                  runtimeClassName: nvidia
                  containers:
                  - name: node
                    env:
                    - name: NCCL_MNNVL_ENABLE
                      value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
{{- else }}
- apiVersion: resource.nvidia.com/v1beta1
  kind: ComputeDomain
  metadata:
    labels:
      app: {{ .EntryName }}
    name: {{ .EntryName }}-compute-domain
  spec:
    channel:
      allocationMode: Single
      resourceClaimTemplate:
        name: {{ .EntryName }}-channel
    numNodes: {{ .NodesPerJob }}
- apiVersion: trainer.kubeflow.org/v1alpha1
  kind: TrainingRuntime
  metadata:
    name: {{ .EntryName }}-runtime
  spec:
    template:
      spec:
        replicatedJobs:
        - name: node
          template:
            spec:
              template:
                spec:
                  containers:
                  - name: node
                    resources:
                      claims:
                      - name: compute-domain-channel
                    env:
                    - name: NCCL_MNNVL_ENABLE
                      value: "{{ if .EnableMNNVL }}1{{ else }}0{{ end }}"
                  resourceClaims:
                  - name: compute-domain-channel
                    resourceClaimTemplateName: {{ .EntryName }}-channel
{{- end }}
